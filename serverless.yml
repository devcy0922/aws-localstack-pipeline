service: aws-localstack-pipeline

frameworkVersion: '3'

plugins:
  - serverless-plugin-typescript
  - serverless-localstack

custom:
  localstack:
    stages:
      - local
    host: http://localhost:4566
    autostart: false
    # LocalStack 상의 엔드포인트 캐싱 및 활성화 서비스 세팅
    lambda:
      mountCode: false

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'local'}
  region: us-east-1
  environment:
    BUCKET_NAME: ${self:service}-bucket-${self:provider.stage}
    AWS_ENDPOINT_URL: ${self:custom.localstack.host}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            - arn:aws:s3:::${self:provider.environment.BUCKET_NAME}
            - arn:aws:s3:::${self:provider.environment.BUCKET_NAME}/*

functions:
  storeFile:
    handler: src/handlers/hello.handler
    events:
      - http:
          path: items
          method: post
          cors: true

resources:
  Resources:
    UploadBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.BUCKET_NAME}
